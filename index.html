<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow, noarchive"><title>Amigo secreto</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <div class="snow snow-one">✦</div><div class="snow snow-two">✦</div><div class="snow snow-three">✦</div>
  <main>
    <header class="hero"><div class="garland" aria-hidden="true"><i>●</i><i>●</i><i>●</i><i>●</i><i>●</i><i>●</i><i>●</i></div><p class="eyebrow">✦ CELEBRAÇÃO EM FAMÍLIA ✦</p><h1>Amigo<br><em>Secreto</em></h1><p>Uma lista de desejos para deixar cada presente ainda mais especial.</p><div class="hero-mark" aria-hidden="true">🎁</div></header>
    <section class="card wishes-card"><div class="section-heading"><div><p class="label">✦ JÁ ESTÁ NA LISTA</p><h2>Desejos da família</h2></div><span class="mistletoe" aria-hidden="true">❋</span></div><div id="list" class="wish-list" aria-live="polite"></div><button type="button" id="open-form" class="add-wish">+ Adicionar desejo</button></section>
    <section id="form-card" class="card form-card" hidden><div class="section-heading"><div><p class="label">É A SUA VEZ</p><h2 id="form-title">Adicionar meu desejo</h2></div><span class="mistletoe" aria-hidden="true">✷</span></div><p class="hint" id="form-hint">Escolha uma senha para poder alterar seu desejo depois.</p>
      <form id="wish-form"><input type="hidden" id="id"><label>Seu nome<input id="name" maxlength="60" required autocomplete="name" placeholder="Ex.: Carol"></label><label>O que você gostaria de ganhar?<textarea id="wish" maxlength="500" required placeholder="Ex.: Um livro de ficção, tamanho... "></textarea></label><label>Sua senha<input id="password" type="password" minlength="4" required autocomplete="new-password" placeholder="Mínimo de 4 caracteres"></label><button type="submit">Salvar desejo</button><button type="button" id="cancel" class="secondary" hidden>Cancelar edição</button><p id="feedback" role="status"></p></form>
    </section>
  </main><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="app.js"></script>
</body></html>
